name: Validate rendered Finals candidate
on:
  push:
    branches: [fix/finals-rendered-tempo]
permissions:
  contents: write
concurrency:
  group: rendered-finals-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed integration on the isolated branch
        run: node scripts/apply-rendered-finals.cjs
      - name: Verify pinned processor files exist
        run: test -f public/vendor/signalsmith-stretch-1.3.2/SignalsmithStretch.mjs
      - name: Regression tests and typecheck
        run: |
          npm test
          npx tsc --noEmit -p tsconfig.test.json
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/audio-browser --no-audit --no-fund playwright@1.56.1
          /tmp/audio-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify actual rendered note frequencies and fade
        env:
          PLAYWRIGHT_MODULE: /tmp/audio-browser/node_modules/playwright
        run: node scripts/audit/rendered-pitch.cjs
      - name: Commit validated integration to candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/audio/AudioProvider.tsx tests/audio-provider.test.tsx docs/audits/2026-10-14-rendered-pitch.json
          git diff --cached --quiet || git commit -m 'Integrate pitch-independent rendered Finals with source-position and slot-clock preservation'
          git push origin HEAD:refs/heads/fix/finals-rendered-tempo
